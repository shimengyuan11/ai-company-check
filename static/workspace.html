<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外贸客户工作台</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">

  <!-- ============ 左：导航栏 ============ -->
  <aside class="sidebar">
    <div class="brand">外贸客户工作台</div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="customers">客户</button>
      <button class="nav-item" data-view="templates">话术库</button>
      <button class="nav-item" data-view="products">产品目录</button>
      <a class="nav-item" href="/">背调工具 ↗</a>
    </nav>
    <div class="sidebar-foot">
      <div id="whoami" class="who"></div>
      <div id="build" class="build-tag"></div>
      <button id="logout" class="ghost-dark" hidden>退出</button>
    </div>
  </aside>

  <!-- ============ 右：内容区 ============ -->
  <main class="content">

    <!-- 未登录不会走到这里：服务端已经把 /app 重定向到 /login -->
    <!-- 已登录 -->
    <section id="app" hidden>

      <!-- 视图一：客户 -->
      <div id="viewCustomers" class="view">
        <div class="pane-main">
          <div class="stats" id="stats"></div>

          <section class="card">
            <div class="newrow">
              <input id="newName" type="text" placeholder="客户姓名（必填）">
              <input id="newPhone" type="text" placeholder="号码（必填）">
              <input id="newCountry" type="text" placeholder="国家（必填）" list="optCountry">
            </div>
            <div class="newrow">
              <input id="newCompany" type="text" placeholder="公司名（选填）">
              <input id="newSource" type="text" placeholder="来源：FB / 邮件 / 展会…" list="optSource">
              <input id="newNote" type="text" placeholder="一句话备注">
              <button id="createCustomer">建档</button>
            </div>
            <p id="appMsg" class="status"></p>
          </section>

          <section class="card">
            <h2>我的客户 <span id="custCount" class="hint"></span></h2>
            <div class="list-tools">
              <input id="searchBox" type="search" class="search" placeholder="搜姓名 / 号码 / 公司">
              <select id="stageFilter" class="tool-select" aria-label="按阶段筛选"></select>
              <select id="sortSelect" class="tool-select" aria-label="排序">
                <option value="recent">最近建档</option>
                <option value="stale">最久没联系</option>
              </select>
            </div>
            <ul id="custList" class="cust-list"></ul>
          </section>
        </div>

        <!-- 右侧详情栏：一直在这儿，不占中间 -->
        <aside class="pane-detail">
          <section class="card">
            <p id="detailEmpty" class="hint">← 左边点一个客户</p>
            <div id="detail" hidden>
              <div class="detail-head">
                <div class="head-row">
                  <h2 id="dTitle"></h2>
                  <div class="head-actions">
                    <button id="toggleHot" class="ghost">标记高意向</button>
                    <button id="deleteCustomer" class="ghost danger">删除</button>
                  </div>
                </div>
                <p id="dMeta" class="hint"></p>
                <div class="stage-row">
                  <label class="stage-label" for="dStage">阶段</label>
                  <select id="dStage" aria-label="客户阶段"></select>
                </div>
              </div>

              <div class="newrow">
                <input id="fuContent" type="text" placeholder="写一条跟进（回车就存）">
                <button id="addFollowup">记下</button>
              </div>
              <ul id="fuList" class="fu-list"></ul>

              <hr>
              <h3 class="section-title">附件（PI / 报价单）</h3>
              <div class="newrow">
                <input id="fileInput" type="file" class="file-input">
                <button id="uploadFile" class="ghost">上传</button>
              </div>
              <p id="fileMsg" class="status"></p>
              <ul id="fileList" class="file-list"></ul>

              <hr>
              <h3 class="section-title">生成话术</h3>
              <div class="newrow">
                <select id="genTemplate" class="tool-select" aria-label="选模板"></select>
              </div>
              <div class="newrow" style="margin-top:8px">
                <input id="genRequest" type="text" placeholder="想达成什么？例如：让他回邮件确认数量">
                <button id="doGenerate">生成</button>
              </div>
              <p id="genMsg" class="status"></p>
              <div id="genOut" hidden class="gen-out">
                <textarea id="genText" rows="5"></textarea>
                <div class="newrow" style="margin-top:8px">
                  <button id="copyGen" class="ghost">复制</button>
                </div>
              </div>
              <ul id="genList" class="fu-list"></ul>

              <hr>
              <h3 class="section-title">转给同事</h3>
              <div class="newrow">
                <select id="transferTo"></select>
                <button id="doTransfer" class="ghost">转给他</button>
              </div>
              <p class="hint" style="margin-top:8px">转出去之后，就归对方管了（你这边不再显示）。</p>
            </div>
          </section>
        </aside>
      </div>

      <!-- 视图二：产品目录 -->
      <div id="viewProducts" class="view" hidden>
        <div class="pane-main">
          <section class="card">
            <div class="newrow">
              <input id="pName" type="text" placeholder="产品名（必填）">
              <input id="pSpec" type="text" placeholder="规格 / 型号">
              <input id="pPrice" type="text" placeholder="参考价（选填）">
              <button id="createProduct">加产品</button>
            </div>
            <p id="prodMsg" class="status"></p>
          </section>
          <section class="card">
            <h2>产品 <span id="prodCount" class="hint"></span></h2>
            <ul id="prodList" class="cust-list"></ul>
          </section>
        </div>
      </div>

      <!-- 视图三：话术库（模板 + 标签，团队共享） -->
      <div id="viewTemplates" class="view" hidden>
        <div class="pane-main">
          <section class="card">
            <h2 id="tplFormTitle">新建话术模板</h2>
            <div class="newrow">
              <input id="tplTitle" type="text" placeholder="标题，例如：首次触达（FB 来的个人买家）">
            </div>
            <textarea id="tplBody" rows="5"
              placeholder="正文。可以用占位符：{客户名} {公司} {国家} {产品} {价格}"></textarea>
            <p class="hint">占位符在生成时自动替换成这个客户的信息——没有占位符，模板就没法复用。</p>

            <h3 class="section-title">标签（可多选，三组）</h3>
            <div id="tplTagPicker" class="tag-picker"></div>
            <div class="newrow tag-newrow">
              <select id="newTagGrp" class="tool-select" aria-label="标签组"></select>
              <input id="newTagName" type="text" placeholder="新标签名">
              <button id="addTag" class="ghost">加标签</button>
            </div>

            <div class="newrow" style="margin-top:12px">
              <button id="saveTemplate">保存模板</button>
              <button id="cancelEdit" class="ghost" hidden>取消编辑</button>
            </div>
            <p id="tplMsg" class="status"></p>
          </section>

          <section class="card">
            <h2>话术模板 <span id="tplCount" class="hint"></span></h2>
            <div class="list-tools">
              <input id="tplSearch" type="search" class="search" placeholder="搜标题 / 正文">
            </div>
            <div id="tplFilterTags" class="tag-picker filter"></div>
            <ul id="tplList" class="cust-list"></ul>
          </section>
        </div>
      </div>

    </section>
  </main>
</div>

<datalist id="optCountry"></datalist>
<datalist id="optSource"></datalist>

<script src="/static/workspace.js"></script>
</body>
</html>
